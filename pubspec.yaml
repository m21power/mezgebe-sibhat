name: mezgebe_sibhat
description: "Mezgebe Sibhat is a mobile application built using Flutter. It serves as a platform for users to access and engage with content related to Mezgebe Sibhat, providing features such as audio playback, offline access, and user-friendly navigation."

publish_to: "none"

version: 1.1.0+27

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  http: ^1.5.0
  shared_preferences: ^2.5.3
  get_it: ^9.0.5
  image_picker: ^1.2.0
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^3.0.1
  dartz: ^0.10.1
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^9.0.0
  google_mobile_ads: ^7.0.0
  url_launcher: ^6.3.2
  in_app_update: ^4.2.5
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/mezgebe_sibhat.png"
  adaptive_icon_background: "assets/launcher_background.png"
  adaptive_icon_foreground: "assets/mezgebe_sibhat.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/mezmure.db.enc
    - .env
